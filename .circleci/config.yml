version: 2.1

jobs:
  test:
    docker:
      - image: cimg/python:3.11-node
    steps:
      - checkout
      - run:
          name: Record the interpreter for the cache key
          # A venv's bin/ is symlinks to one exact interpreter, so a cache keyed
          # only on requirements-dev.txt outlives the interpreter it was built
          # against: cimg/python:3.11 rolls its patch version, the restored
          # symlinks dangle, and every build fails in "Install dependencies"
          # until someone bumps the key by hand. Keying on the version too means
          # an image roll just misses the cache instead of poisoning it.
          command: python -V > .python-version-ci
      - restore_cache:
          keys:
            - deps-v2-{{ checksum ".python-version-ci" }}-{{ checksum "requirements-dev.txt" }}
      - run:
          name: Install dependencies
          command: |
            # Belt as well as braces. `python -m venv` will not replace a
            # dangling bin/python — it sees the symlink and leaves it — so a
            # broken restored venv is worse than none at all. Check that the
            # interpreter actually runs, and start over if it doesn't.
            if ! venv/bin/python -V >/dev/null 2>&1; then
              rm -rf venv
              python -m venv venv
            fi
            . venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements-dev.txt
      - save_cache:
          key: deps-v2-{{ checksum ".python-version-ci" }}-{{ checksum "requirements-dev.txt" }}
          paths:
            - venv
      - run:
          name: Lint
          # Before the tests: a lint failure is a second, and finding out about
          # it after a 40-second suite is 40 seconds wasted.
          command: |
            . venv/bin/activate
            ruff check ditto/ tests/
      - run:
          name: Check the shell scripts
          # install.sh and provision.sh are the least-tested surface here. They
          # cannot be unit tested, and they partition disks and run as root on a
          # device with a read-only root.
          #
          # shellcheck ships in the cimg image, so there is nothing to install.
          # If a future image drops it this fails with "command not found",
          # which is the right way round: a missing checker should stop the
          # build rather than quietly pass it.
          command: shellcheck install.sh provision.sh
      - run:
          name: Run tests
          command: |
            . venv/bin/activate
            pytest -q
          environment:
            # test_frontend runs `node --check` over app.js. Without this the
            # check turns into a permanent green skip the moment the image loses
            # node, and a page whose script never parses ships unnoticed.
            DITTO_STRICT_FRONTEND: "1"

workflows:
  test:
    jobs:
      - test
