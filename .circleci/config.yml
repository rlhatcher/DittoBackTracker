version: 2.1

jobs:
  test:
    docker:
      - image: cimg/python:3.11
    steps:
      - checkout
      - restore_cache:
          keys:
            - deps-v1-{{ checksum "requirements-dev.txt" }}
      - run:
          name: Install dependencies
          command: |
            python -m venv venv
            . venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements-dev.txt
      - save_cache:
          key: deps-v1-{{ checksum "requirements-dev.txt" }}
          paths:
            - venv
      - run:
          name: Run tests
          command: |
            . venv/bin/activate
            pytest -q

workflows:
  test:
    jobs:
      - test
