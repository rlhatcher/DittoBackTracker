<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111">
<title>DittoBackTracker</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="wrap">

  <header>
    <h1>DittoBackTracker</h1>
    <div class="meta">
      <span id="pedal"><span class="dot" style="background:var(--tx2)"></span>—</span>
    </div>
  </header>

  <div class="card" id="capcard">
    <div class="row"><span>Capacity</span><span id="captxt">—</span></div>
    <div class="capbar"><div class="capfill" id="capfill" style="width:0"></div></div>
    <div class="row"><span id="capnote"></span></div>
  </div>

  <div class="card" id="slotcard">
    <h2>Slots</h2>
    <div id="grid"></div>
  </div>

  <div class="card" id="listcard">
    <div class="listhead">
      <h2>On the pedal</h2>
      <button class="link" id="print" type="button" title="Print the backing-track list" hidden>Print</button>
    </div>
    <div id="list"></div>
  </div>

  <div class="card" id="libcard">
    <div class="listhead">
      <h2>Library</h2>
      <label class="link" for="libfile" id="libadd" title="Add tracks without putting them on the pedal">Add files</label>
    </div>
    <input type="file" id="libfile" multiple accept="audio/*" class="vh">
    <div class="libtools" id="libtools" hidden>
      <input type="search" id="libq" placeholder="Search" aria-label="Search the library"
             autocomplete="off" autocorrect="off" spellcheck="false">
      <select id="libsort" aria-label="Sort the library">
        <option value="added">Newest first</option>
        <option value="name">Name</option>
        <option value="duration">Length</option>
      </select>
    </div>
    <div id="librows"></div>
    <div class="row" id="libfoot"></div>
  </div>

  <label id="drop" for="file">
    <div style="font-size:22px;margin-bottom:4px" aria-hidden="true">↓</div>
    <span id="drophead">Drop audio here, or click to choose</span>
    <div style="font-size:12px;margin-top:6px" id="dropnote">
      Drop straight onto a slot to target it, or use a leading number —
      “07 Blue Bossa.mp3”
    </div>
  </label>
  <input type="file" id="file" multiple accept="audio/*" class="vh">

  <div class="foot">
    <span id="ver">—</span>
    <button class="link" id="update" type="button" hidden>Update available</button>
  </div>

</div>

<div class="bar">
  <div class="prog hide" id="progwrap" role="progressbar" aria-label="Conversion progress"
       aria-valuemin="0" aria-valuemax="100"><div class="progfill" id="progfill"></div></div>
  <div class="msg" id="msg" role="status" aria-live="polite">Connecting…</div>
  <span id="undoslot"></span>
  <button class="act" id="done" disabled>Done</button>
</div>

<script src="/static/app.js"></script>
</body>
</html>
