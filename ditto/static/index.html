<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f2f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1918" media="(prefers-color-scheme: dark)">
<title>DittoBackTracker</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>

<header>
  <h1>DittoBackTracker</h1>
  <span id="pedal"><span class="dot"></span>—</span>
  <span id="ver">—</span>
  <button class="link" id="update" type="button" hidden>Check for update</button>
</header>

<div class="cols">

  <div class="pane pane-l">

    <section id="capcard">
      <div class="row"><h2>Capacity</h2><span id="captxt">—</span></div>
      <div class="capbar"><div class="capfill" id="capfill" style="width:0"></div></div>
      <div class="row"><span id="capnote"></span></div>
    </section>

    <section id="slotcard">
      <h2>Slots</h2>
      <div id="grid"></div>
      <div class="legend">
        <span><i class="k-synced"></i>on pedal</span>
        <span><i class="k-converting"></i>converting</span>
        <span><i class="k-queued"></i>queued</span>
        <span><i></i>empty</span>
        <span><i class="k-loop"></i>holds a recorded loop</span>
      </div>
    </section>

    <section id="dropsec">
      <label id="drop" for="file">
        <span id="drophead">Drop audio here, or choose a file</span>
        <span id="dropnote">
          Drop straight onto a slot to target it, or use a leading number —
          “07 Blue Bossa.mp3”
        </span>
      </label>
      <input type="file" id="file" multiple accept="audio/*" class="vh">
    </section>

    <section id="listcard">
      <div class="listhead">
        <h2>On the pedal</h2>
        <button class="link" id="print" type="button" title="Print the backing-track list" hidden>Print list</button>
      </div>
      <div id="list"></div>
    </section>

  </div>

  <div class="pane pane-r">

    <section id="libcard">
      <div class="listhead">
        <h2>Library — stays on the device</h2>
        <label class="libbtn" for="libfile" id="libadd" title="Add tracks without putting them on the pedal">Add files</label>
      </div>
      <input type="file" id="libfile" multiple accept="audio/*" class="vh">
      <div class="libtools" id="libtools" hidden>
        <input type="search" id="libq" placeholder="Search the library" aria-label="Search the library"
               autocomplete="off" autocorrect="off" spellcheck="false">
        <select id="libsort" aria-label="Sort the library">
          <option value="added">Newest first</option>
          <option value="name">Name</option>
          <option value="duration">Length</option>
        </select>
      </div>
      <div id="librows"></div>
      <div class="row" id="libfoot"></div>
    </section>

  </div>

</div>

<div class="bar">
  <div class="prog hide" id="progwrap" role="progressbar" aria-label="Conversion progress"
       aria-valuemin="0" aria-valuemax="100"><div class="progfill" id="progfill"></div></div>
  <div class="msg" id="msg" role="status" aria-live="polite">Connecting…</div>
  <span id="undoslot"></span>
  <button class="act" id="done" disabled>Done<span class="wide-only"> — unmount and shut down</span></button>
</div>

<script src="/static/app.js"></script>
</body>
</html>
